name: Deploy Supabase

# Deploys the Edge Functions, and optionally pushes migrations.
#
# OPTIONAL AND DORMANT. The project deploys with the Supabase CLI by hand — see
# docs/LOCAL_SETUP.md, which is the supported route. This workflow exists only
# as an alternative and never runs on its own: it is manual-dispatch only, so it
# cannot fail in the background when the repository secrets are absent.
#
# To use it, add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as repository
# secrets. Otherwise it is safe to delete this file.

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: 'Also apply database migrations (needs SUPABASE_DB_PASSWORD)'
        type: boolean
        default: false

concurrency:
  # Never let two deploys race against the same project.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pink-wardrobe

    steps:
      - uses: actions/checkout@v4

      # The CLI comes from npm rather than supabase/setup-cli@v1. That action
      # resolves "latest" through GitHub's releases API unauthenticated, which
      # rate-limits and fails the whole run:
      #   Failed to resolve latest Supabase CLI release: rate limit exceeded
      # npm has no such limit, and this matches what docs/LOCAL_SETUP.md tells
      # a human to run.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: |
          npm install --no-save --no-audit --no-fund supabase
          npx supabase --version

      - name: Check required secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=0
          [ -z "$ACCESS_TOKEN" ] && echo "::error::SUPABASE_ACCESS_TOKEN is not set" && missing=1
          [ -z "$PROJECT_REF" ]  && echo "::error::SUPABASE_PROJECT_REF is not set"  && missing=1
          [ "$missing" -eq 1 ] && exit 1
          echo "Secrets present."

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # signup must be callable before the user has a session, and the
          # purge job authenticates with its own header rather than a JWT.
          npx supabase functions deploy signup \
            --project-ref "$PROJECT_REF" --no-verify-jwt

          npx supabase functions deploy purge-recycle-bin \
            --project-ref "$PROJECT_REF" --no-verify-jwt

          # process-garment spends money, so it always requires a real session.
          npx supabase functions deploy process-garment \
            --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: inputs.push_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required to push migrations."
            exit 1
          fi

          npx supabase link --project-ref "$PROJECT_REF"
          npx supabase db push

      - name: Summary
        run: |
          {
            echo "### Supabase deploy complete"
            echo ""
            echo "| Function | JWT required |"
            echo "| --- | --- |"
            echo "| signup | no |"
            echo "| purge-recycle-bin | no |"
            echo "| process-garment | yes |"
            echo ""
            echo "Secrets (FASHN_API_KEY, PURGE_SECRET) are set in the Supabase"
            echo "dashboard, not here, and are read at invocation time."
          } >> "$GITHUB_STEP_SUMMARY"
